<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EED8"/>
      <stop offset="35%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8A662C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C5A059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 圆角背景卡片 -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- 装饰光环背景 -->
  <circle cx="256" cy="256" r="140" fill="#C5A059" opacity="0.08"/>

  <!-- 书本矢量图形 -->
  <g transform="translate(116, 126) scale(11.6)" filter="url(#goldGlow)">
    <!-- 书本主体 -->
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 内部书签 / 纹理 -->
    <path d="M12 6v6" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 9h6" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 右上角闪耀金星 -->
  <g transform="translate(340, 110) scale(1.8)" filter="url(#goldGlow)">
    <path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z" fill="url(#goldGrad)"/>
  </g>
</svg>
